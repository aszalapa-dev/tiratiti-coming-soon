<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiratiti · On arrive</title>
  <meta name="description" content="Tiratiti — le vrai tiramisu italien, fait maison. On arrive, prépare ta cuillère.">
  <meta name="theme-color" content="#891e20">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Tiratiti · On arrive">
  <meta property="og:description" content="Le vrai tiramisu italien, fait maison. On arrive, prépare ta cuillère.">
  <meta property="og:locale" content="fr_BE">

  <link rel="preload" href="fonts/HarabaraMais-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/HelveticaNeue-Light.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face {
      font-family: "Harabara Mais";
      src: url("fonts/HarabaraMais-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Helvetica Neue";
      src: url("fonts/HelveticaNeue-Light.woff2") format("woff2");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Couleurs écran relevées dans l'étiquette Le Classique fournie. */
      --red: #891e20;
      --cream: #f6f3ee;
      --brown: #371712;
      --white: #fff;
      --font-display: "Harabara Mais", sans-serif;
      --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--red);
      color: var(--cream);
      font-family: var(--font-body);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      isolation: isolate;
      height: 100vh;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
      text-align: center;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .wave { fill: var(--white); }
    .chocolate { fill: var(--brown); }

    .intro {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 660px);
      margin-inline: auto;
      padding-top: clamp(24px, 4.5vh, 56px);
      padding-top: clamp(24px, 4.5svh, 56px);
      animation: rise .9s cubic-bezier(.22, 1, .36, 1) both;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(28px, 3.6vw, 42px);
      line-height: 1.04;
      letter-spacing: .02em;
      -webkit-text-stroke: .7px currentColor;
      paint-order: stroke fill;
      text-transform: uppercase;
    }

    .rule {
      width: 64px;
      height: 3px;
      margin: clamp(17px, 2.5vh, 24px) auto;
      border-radius: 3px;
      background: var(--cream);
    }

    p {
      max-width: 44ch;
      margin: 0 auto;
      font-size: clamp(15px, 1.6vw, 18px);
      line-height: 1.6;
      color: var(--cream);
    }

    .canette {
      position: absolute;
      bottom: 0;
      left: 50%;
      z-index: 0;
      display: block;
      width: clamp(300px, 64vh, 700px);
      width: clamp(300px, 64svh, 700px);
      max-width: none;
      height: auto;
      transform: translate(-50%, 6%);
    }

    @media (max-height: 700px) {
      .intro { padding-top: 22px; }
      h1 { font-size: clamp(27px, 3.2vw, 36px); }
      .rule { margin-block: 17px; }
      p { font-size: 14px; line-height: 1.5; }
    }

    @media (max-height: 600px) {
      h1 { font-size: clamp(25px, 3vw, 32px); }
    }

    @media (max-width: 360px) {
      .intro { width: calc(100% - 32px); }
      h1 { font-size: 25px; letter-spacing: .01em; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro { animation: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <svg class="background" viewBox="0 0 1440 1000" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <path class="wave" d="M0 690 C300 860 650 530 950 640 C1150 714 1300 780 1440 700 V1000 H0 Z"/>
      <path class="chocolate" d="M0 714 C300 884 650 554 950 664 C1150 738 1300 804 1440 724 V1000 H0 Z"/>
    </svg>

    <div class="intro">
      <h1>On arrive.<br>Prépare ta cuillère.</h1>
      <div class="rule" aria-hidden="true"></div>
      <p>Les premiers points de vente Tiratiti seront annoncés ici. Encore un peu de patience&nbsp;: on prépare notre entrée au rayon frais.</p>
    </div>

    <img class="canette" src="canette-classique.png" alt="Canette de tiramisu Tiratiti Le Classique" width="1150" height="1367" fetchpriority="high" decoding="async">
  </main>
</body>
</html>
