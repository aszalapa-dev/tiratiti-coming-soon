  <meta property="og:title" content="Tiratiti | Tiramisu italien fait maison – Site officiel">
  <meta property="og:description" content="Découvrez Tiratiti, le tiramisu italien fait maison en canette. Les premiers points de vente seront annoncés ici. Prépare ta cuillère.">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://tiratiti.be/#website",
          "url": "https://tiratiti.be/",
          "name": "Tiratiti",
          "alternateName": "tiratiti.be",
          "inLanguage": "fr-BE",
          "publisher": { "@id": "https://tiratiti.be/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://tiratiti.be/#organization",
          "url": "https://tiratiti.be/",
          "name": "Tiratiti",
          "logo": "https://tiratiti.be/logo-full-ink.png"
        }
      ]
    }
  </script>

  <link rel="preload" href="fonts/InterTight-Black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/HelveticaNeue-Light.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face {
      font-family: "Inter Tight";
      src: url("fonts/InterTight-Black.woff2") format("woff2");
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Helvetica Neue";
      src: url("fonts/HelveticaNeue-Light.woff2") format("woff2");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Couleurs écran relevées dans l'étiquette Le Classique fournie. */
      --label-cream: #e3d3c3;
      --cream: #f6f3ee;
      --brown: #3a1210;
      --white: #fff;
      --font-display: "Inter Tight", sans-serif;
      --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--brown);
      color: var(--cream);
      font-family: var(--font-body);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      isolation: isolate;
      height: 100vh;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
      text-align: center;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .wave { fill: var(--white); }
    .lower-background { fill: var(--label-cream); }

    .intro {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 660px);
      margin-inline: auto;
      padding-top: clamp(24px, 4.5vh, 56px);
      padding-top: clamp(24px, 4.5svh, 56px);
      animation: rise .9s cubic-bezier(.22, 1, .36, 1) both;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(28px, 3.6vw, 42px);
      line-height: 1.04;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .rule {
      width: 64px;
      height: 3px;
      margin: clamp(17px, 2.5vh, 24px) auto;
      border-radius: 3px;
      background: var(--cream);
    }

    p {
      max-width: 44ch;
      margin: 0 auto;
      font-size: clamp(15px, 1.6vw, 18px);
      line-height: 1.6;
      color: var(--cream);
    }

    .canette {
      position: absolute;
      bottom: 0;
      left: 50%;
      z-index: 0;
      display: block;
      width: clamp(300px, 60vh, 700px);
      width: clamp(300px, 60svh, 700px);
      max-width: none;
      height: auto;
      transform: translate(-50%, 6%);
    }

    @media (max-height: 700px) {
      .intro { padding-top: 22px; }
      h1 { font-size: clamp(27px, 3.2vw, 36px); }
      .rule { margin-block: 17px; }
      p { font-size: 14px; line-height: 1.5; }
    }

    @media (max-height: 600px) {
      h1 { font-size: clamp(25px, 3vw, 32px); }
    }

    @media (max-width: 360px) {
      .intro { width: calc(100% - 32px); }
      h1 { font-size: 25px; letter-spacing: .01em; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro { animation: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <svg class="background" viewBox="0 0 1440 1000" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <path class="wave" d="M0 690 C300 860 650 530 950 640 C1150 714 1300 780 1440 700 V1000 H0 Z"/>
      <path class="lower-background" d="M0 714 C300 884 650 554 950 664 C1150 738 1300 804 1440 724 V1000 H0 Z"/>
    </svg>

    <div class="intro">
      <h1>On arrive.<br>Prépare ta cuillère.</h1>
      <div class="rule" aria-hidden="true"></div>
      <p>Le tiramisu italien fait maison signé Tiratiti arrive bientôt au rayon frais. Les premiers points de vente seront annoncés ici. Prépare ta cuillère.</p>
    </div>

    <img class="canette" src="canette-classique.png" alt="Canette de tiramisu Tiratiti Le Classique" width="1151" height="1367" fetchpriority="high" decoding="async">
  </main>
</body>
</html>
